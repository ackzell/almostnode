<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real Vite 8 Demo — almostnode</title>
    <link rel="stylesheet" href="./shared-styles.css" />
    <style>
      .layout {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1px;
        background: var(--border);
        height: calc(100vh - 44px);
      }
      @media (max-width: 700px) {
        .layout { grid-template-columns: 1fr; }
      }
      .panel { display: flex; flex-direction: column; background: var(--surface); overflow: hidden; }
      .panel-header {
        display: flex; align-items: center; justify-content: space-between;
        padding: 8px 14px; border-bottom: 1px solid var(--border);
        font-size: 12px; font-family: var(--mono); color: var(--text-dim);
      }
      .panel-label { font-family: var(--mono); font-size: 12px; color: var(--text-dim); }
      .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #666; flex-shrink: 0; }
      .status-dot.running { background: var(--accent); }
      .status-dot.error { background: var(--error); }
      .preview-frame { width: 100%; flex: 1; border: none; background: #fff; }
      .preview-placeholder {
        flex: 1; display: flex; align-items: center; justify-content: center;
        color: var(--text-dim); font-size: 14px;
      }
      .editor-wrap { flex: 1; overflow: hidden; min-height: 0; }
      .editor-wrap textarea {
        width: 100%; height: 100%; padding: 14px; margin: 0; border: none; resize: none;
        background: transparent; font-family: var(--mono); font-size: 13px; line-height: 1.7;
        color: var(--accent); tab-size: 2; outline: none;
      }
      .file-tabs { display: flex; border-bottom: 1px solid var(--border); overflow-x: auto; background: var(--black); }
      .file-tab {
        padding: 8px 14px; font-family: var(--mono); font-size: 11px; color: var(--text-dim);
        background: none; border: none; border-bottom: 2px solid transparent;
        cursor: pointer; white-space: nowrap;
      }
      .file-tab:hover { color: var(--text); }
      .file-tab.active { color: var(--text-bright); border-bottom-color: var(--accent); }
      .terminal {
        flex: 1; overflow-y: auto; padding: 12px;
        font-family: var(--mono); font-size: 12px; line-height: 1.6;
        background: var(--black);
      }
      .terminal div { white-space: pre-wrap; word-break: break-all; }
      .toolbar {
        display: flex; gap: 6px; padding: 10px 14px;
        border-top: 1px solid var(--border);
      }
      .btn {
        padding: 6px 14px; border: 1px solid var(--border); border-radius: 6px;
        background: var(--surface-2); color: var(--text-bright); font-size: 12px;
        font-family: var(--mono); cursor: pointer;
      }
      .btn:disabled { opacity: 0.4; cursor: default; }
      .btn:not(:disabled):hover { border-color: var(--accent); color: var(--accent); }
      .btn-primary { background: var(--accent); color: var(--black); border-color: var(--accent); }
      .btn-primary:not(:disabled):hover { background: var(--accent-dim); }
    </style>
  </head>
  <body>
    <div class="demo-topbar">
      <a href="../index.html" class="back">← demos</a>
      <span class="sep">/</span>
      <a href="../index.html" class="logo">almostnode</a>
      <span class="sep">/</span>
      <span class="title">Real Vite 8</span>
      <span class="tag">vite · real · hmr</span>
    </div>

    <div class="layout">
      <!-- Editor + Console (left panel) -->
      <div class="panel">
        <div class="panel-header">
          <div style="display:flex;align-items:center;gap:6px;">
            <div class="status-dot" id="status-dot"></div>
            <span class="panel-label" id="status-text">Initializing...</span>
          </div>
          <span class="panel-label" id="hmr-badge" style="opacity:0;transition:opacity 0.3s;">HMR active</span>
        </div>

        <div class="file-tabs" id="file-tabs">
          <button class="file-tab active" data-file="/index.html">index.html</button>
          <button class="file-tab" data-file="/src/app.ts">app.ts</button>
          <button class="file-tab" data-file="/src/style.css">style.css</button>
        </div>

        <div class="editor-wrap">
          <textarea id="editor" spellcheck="false" disabled></textarea>
        </div>

        <div class="terminal" id="output"></div>

        <div class="toolbar">
          <button id="save-btn" class="btn btn-primary" disabled>Save (⌘S)</button>
          <button id="install-btn" class="btn" disabled>Install Vite 8</button>
          <button id="start-btn" class="btn" disabled>Start Server</button>
          <button id="stop-btn" class="btn" disabled>Stop</button>
        </div>
      </div>

      <!-- Preview (right panel) -->
      <div class="panel">
        <div class="panel-header">
          <span class="panel-label">Live Preview</span>
        </div>
        <div class="preview-placeholder" id="preview-placeholder">
          Click Start to launch the real Vite 8 dev server
        </div>
        <iframe id="preview-frame" class="preview-frame" style="display:none;"></iframe>
      </div>
    </div>

    <script type="module">
      import { initRealViteDemo, installRealVite, startRealViteServer } from '../src/real-vite-demo.ts';

      const outputEl = document.getElementById('output');
      const editorEl = document.getElementById('editor');
      const statusDot = document.getElementById('status-dot');
      const statusText = document.getElementById('status-text');
      const hmrBadge = document.getElementById('hmr-badge');
      const installBtn = document.getElementById('install-btn');
      const startBtn = document.getElementById('start-btn');
      const stopBtn = document.getElementById('stop-btn');
      const saveBtn = document.getElementById('save-btn');
      const previewFrame = document.getElementById('preview-frame');
      const previewPlaceholder = document.getElementById('preview-placeholder');
      const fileTabsEl = document.getElementById('file-tabs');

      const FILES = [
        '/index.html',
        '/src/app.ts',
        '/src/style.css',
      ];

      let vfs, runtime, npm;
      let server = null;
      let currentFile = '/index.html';
      let serverRunning = false;

      function log(msg) {
        const line = document.createElement('div');
        line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
        outputEl.appendChild(line);
        outputEl.scrollTop = outputEl.scrollHeight;
      }

      function setStatus(state, text) {
        statusDot.className = 'status-dot' + (state ? ' ' + state : '');
        statusText.textContent = text;
      }

      function setButtons(opts) {
        installBtn.disabled = !opts.install;
        startBtn.disabled = !opts.start;
        stopBtn.disabled = !opts.stop;
        saveBtn.disabled = !opts.save;
        editorEl.disabled = !opts.edit;
      }

      function loadFile(path) {
        if (!vfs) return;
        try {
          const content = vfs.readFileSync(path, 'utf8');
          editorEl.value = content;
          currentFile = path;
          document.querySelectorAll('.file-tab').forEach((tab) => {
            tab.classList.toggle('active', tab.dataset.file === path);
          });
        } catch (e) {
          log(`Error loading ${path}: ${e.message}`, 'error');
        }
      }

      function saveFile() {
        if (!vfs || !currentFile) return;
        try {
          vfs.writeFileSync(currentFile, editorEl.value);
          log(`Saved: ${currentFile}`);
        } catch (e) {
          log(`Error saving: ${e.message}`, 'error');
        }
      }

      async function init() {
        try {
          setStatus('', 'Initializing...');
          const result = await initRealViteDemo(outputEl);
          vfs = result.vfs;
          runtime = result.runtime;
          npm = result.npm;
          loadFile(currentFile);
          setStatus('running', 'Ready');
          setButtons({ install: true, start: false, stop: false, save: false, edit: true });
          log('Ready. Click "Install Vite 8" to begin.');
        } catch (e) {
          setStatus('error', 'Init failed');
          log(`Error: ${e.message}`);
        }
      }

      async function doInstall() {
        try {
          setButtons({ install: false, start: false, stop: false, save: false, edit: false });
          setStatus('', 'Installing Vite 8...');
          await installRealVite(npm, log);
          setStatus('running', 'Vite 8 installed');
          setButtons({ install: false, start: true, stop: false, save: false, edit: true });
          log('Ready. Click "Start Server".');
        } catch (e) {
          setStatus('error', 'Install failed');
          log(`Error: ${e.message}`);
          setButtons({ install: true, start: false, stop: false, save: false, edit: true });
        }
      }

      async function doStart() {
        try {
          setButtons({ install: false, start: false, stop: false, save: false, edit: false });
          setStatus('', 'Starting server...');
          const result = await startRealViteServer(vfs, runtime, npm, log);
          server = result.server;
          serverRunning = true;
          setStatus('running', 'Server running');
          setButtons({ install: false, start: false, stop: true, save: true, edit: true });
          hmrBadge.style.opacity = '1';
          previewPlaceholder.style.display = 'none';
          previewFrame.style.display = 'block';
          previewFrame.onload = () => {
            if (previewFrame.contentWindow) {
              server.setHMRTarget(previewFrame.contentWindow);
              log('HMR target connected');
            }
          };
          previewFrame.src = result.url;
          log('Server started! Edit files and save to trigger HMR.');
        } catch (e) {
          setStatus('error', 'Start failed');
          log(`Error: ${e.message}`);
          setButtons({ install: false, start: true, stop: false, save: false, edit: true });
        }
      }

      async function doStop() {
        try {
          if (server) {
            await server.close();
            server = null;
          }
          serverRunning = false;
          previewFrame.style.display = 'none';
          previewPlaceholder.style.display = 'flex';
          hmrBadge.style.opacity = '0';
          setStatus('running', 'Stopped');
          setButtons({ install: false, start: true, stop: false, save: false, edit: true });
          log('Server stopped.');
        } catch (e) {
          log(`Error stopping: ${e.message}`);
        }
      }

      fileTabsEl.addEventListener('click', (e) => {
        const tab = e.target.closest('.file-tab');
        if (tab) loadFile(tab.dataset.file);
      });

      editorEl.addEventListener('keydown', (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key === 's') {
          e.preventDefault();
          saveFile();
        }
      });

      installBtn.addEventListener('click', doInstall);
      startBtn.addEventListener('click', doStart);
      stopBtn.addEventListener('click', doStop);
      saveBtn.addEventListener('click', saveFile);

      init();
    </script>
  </body>
</html>
