<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vue 3 + Real Vite — almostnode demo</title>
  <link rel="stylesheet" href="./shared-styles.css">
  <style>
    .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; height: calc(100vh - 44px); }
    .panel { display: flex; flex-direction: column; background: var(--black); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .panel-header { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--text-dim); }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #666; flex-shrink: 0; }
    .status-dot.running { background: var(--accent); }
    .status-dot.error { background: var(--error); }
    .editor-wrap { flex: 1; overflow: hidden; min-height: 0; }
    .editor-wrap textarea {
      width: 100%; height: 100%; padding: 14px; margin: 0; border: none; resize: none;
      background: transparent; font-family: var(--mono); font-size: 13px; line-height: 1.7;
      color: var(--accent); tab-size: 2; outline: none;
    }
    .terminal { flex: 0 0 30%; overflow-y: auto; padding: 10px 12px; font-family: var(--mono); font-size: 12px; line-height: 1.6; border-top: 1px solid var(--border); color: var(--text-dim); }
    .toolbar { display: flex; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--border); }
    .preview-placeholder { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text-dim); font-size: 14px; }
    .preview-frame { flex: 1;  border: none;  display: block;  background: #0e0e1a; }    #hmr-badge { opacity: 0; transition: opacity 0.3s; }
  </style>
</head>
<body>
  <div class="demo-topbar">
    <a href="../index.html" class="logo">almostnode</a>
    <span class="sep">/</span>
    <span class="title">Vue 3 + Real Vite</span>
    <span class="tag">vue · vite · plugin-vue</span>
  </div>

  <div class="layout">
    <!-- Editor + Console (left panel) -->
    <div class="panel">
      <div class="panel-header">
        <div style="display:flex;align-items:center;gap:6px;">
          <div class="status-dot" id="status-dot"></div>
          <span class="panel-label" id="status-text">Initializing...</span>
        </div>
        <span class="panel-label" id="hmr-badge">HMR active</span>
      </div>
      <div class="editor-wrap">
        <textarea id="editor" spellcheck="false" disabled></textarea>
      </div>
      <div class="terminal" id="output"></div>
      <div class="toolbar">
        <button id="save-btn" class="btn btn-primary" disabled>Save (⌘S)</button>
        <button id="install-btn" class="btn" disabled>Install Vue + Vite</button>
        <button id="start-btn" class="btn" disabled>Start Server</button>
        <button id="stop-btn" class="btn" disabled>Stop</button>
      </div>
    </div>

    <!-- Preview (right panel) -->
    <div class="panel">
      <div class="panel-header">
        <span class="panel-label">Live Preview</span>
      </div>
      <div class="preview-placeholder" id="preview-placeholder">
        Click Start to launch the real Vite 7 dev server
      </div>
      <iframe id="preview-frame" class="preview-frame" style="display:none;"></iframe>
    </div>
  </div>

  <script type="module">
    import { initVueRealViteDemo, installVueDeps, startVueRealViteServer } from '../src/vue-real-vite-demo.ts';

    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const outputEl = document.getElementById('output');
    const editorEl = document.getElementById('editor');
    const installBtn = document.getElementById('install-btn');
    const startBtn = document.getElementById('start-btn');
    const stopBtn = document.getElementById('stop-btn');
    const saveBtn = document.getElementById('save-btn');
    const previewPlaceholder = document.getElementById('preview-placeholder');
    const previewFrame = document.getElementById('preview-frame');
    const hmrBadge = document.getElementById('hmr-badge');

    let vfs, runtime, npm, server;
    const VUE_FILE = '/src/App.vue';

    function log(msg) {
      const line = document.createElement('div');
      line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      outputEl.appendChild(line);
      outputEl.scrollTop = outputEl.scrollHeight;
    }

    function setStatus(state, text) {
      statusDot.className = 'status-dot' + (state ? ' ' + state : '');
      statusText.textContent = text;
    }

    function setButtons(opts) {
      installBtn.disabled = !opts.install;
      startBtn.disabled = !opts.start;
      stopBtn.disabled = !opts.stop;
      saveBtn.disabled = !opts.save;
      editorEl.disabled = !opts.edit;
    }

    function loadAppFile() {
      if (!vfs) return;
      editorEl.value = vfs.readFileSync(VUE_FILE, 'utf8');
    }

    function saveFile() {
      if (!vfs) return;
      try {
        vfs.writeFileSync(VUE_FILE, editorEl.value);
        log('Saved: ' + VUE_FILE);
      } catch (e) {
        log('Error saving: ' + e.message);
      }
    }

    async function init() {
      try {
        setStatus('', 'Initializing...');
        const result = await initVueRealViteDemo(outputEl);
        vfs = result.vfs;
        runtime = result.runtime;
        npm = result.npm;
        loadAppFile();
        setStatus('running', 'Ready');
        setButtons({ install: true, start: false, stop: false, save: false, edit: true });
        log('Ready. Click "Install Vue + Vite" to begin.');
      } catch (e) {
        setStatus('error', 'Init failed');
        log('Error: ' + e.message);
      }
    }

    async function doInstall() {
      try {
        setButtons({ install: false, start: false, stop: false, save: false, edit: false });
        setStatus('', 'Installing Vue + Vite...');
        await installVueDeps(npm, log);
        setStatus('running', 'Installed');
        setButtons({ install: false, start: true, stop: false, save: false, edit: true });
        log('Ready. Click "Start Server".');
      } catch (e) {
        setStatus('error', 'Install failed');
        log('Error: ' + e.message);
        setButtons({ install: true, start: false, stop: false, save: false, edit: true });
      }
    }

    async function doStart() {
      try {
        setButtons({ install: false, start: false, stop: false, save: false, edit: false });
        setStatus('', 'Starting server...');
        const result = await startVueRealViteServer(vfs, runtime, npm, log);
        server = result.server;
        setStatus('running', 'Server running');
        setButtons({ install: false, start: false, stop: true, save: true, edit: true });
        hmrBadge.style.opacity = '1';
        previewPlaceholder.style.display = 'none';
        previewFrame.style.display = 'block';
        previewFrame.onload = () => {
          if (previewFrame.contentWindow) {
            server.setHMRTarget(previewFrame.contentWindow);
            log('HMR target connected');
          }
        };
        previewFrame.src = result.url;
        log('Server started! Edit App.vue and save to trigger HMR.');
      } catch (e) {
        setStatus('error', 'Start failed');
        log('Error: ' + e.message);
        setButtons({ install: false, start: true, stop: false, save: false, edit: true });
      }
    }

    async function doStop() {
      try {
        if (server) {
          await server.close();
          server = null;
        }
        previewFrame.style.display = 'none';
        previewPlaceholder.style.display = 'flex';
        hmrBadge.style.opacity = '0';
        setStatus('running', 'Stopped');
        setButtons({ install: false, start: true, stop: false, save: false, edit: true });
        log('Server stopped.');
      } catch (e) {
        log('Error stopping: ' + e.message);
      }
    }

    editorEl.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 's') {
        e.preventDefault();
        saveFile();
      }
    });

    installBtn.addEventListener('click', doInstall);
    startBtn.addEventListener('click', doStart);
    stopBtn.addEventListener('click', doStop);
    saveBtn.addEventListener('click', saveFile);

    init();
  </script>
</body>
</html>
